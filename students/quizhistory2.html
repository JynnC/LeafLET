<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz History</title>
  <link rel="stylesheet" href="../assets/css/quizhistory2.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="phone">
    <section class="content">
      <header class="top-bar">
        <div class="brand">
          <div class="logo-placeholder">
            <img src="../assets/images/LOGO.png" alt="LeafLET logo" />
          </div>
          <div class="brand-text">
            <h1>LeafLET</h1>
            <span>LET Reviewer</span>
          </div>
        </div>

        <div class="top-right">
          <div class="status-badge">
            <span class="status-icon"></span>
            <span class="status-value"></span>
          </div>
          <div class="profile-photo"></div>
        </div>
      </header>

      <section class="title-row">
        <button class="back-button" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="page-heading">
          <h1>Quiz History</h1>
          <p>To be done lessons and finished lessons</p>
        </div>
      </section>

      <section class="stats-block">
        <div class="stats-card">
          <div>
            <span class="stat-icon">
              <img src="../assets/images/Medal.png" alt="Achievements" />
            </span>
            <span class="stat-value"></span>
            <p>Achievements</p>
          </div>
          <div>
            <span class="stat-icon">
              <img src="../assets/images/Leaderboard.png" alt="Ranking" />
            </span>
            <span class="stat-value"></span>
            <p>Ranking</p>
          </div>
        </div>
      </section>

      <section class="section-block">
        <h2>Continue Studying</h2>
        <div class="study-grid">
          <article class="study-card">
            <div class="study-icon"></div>
            <div class="study-copy">
              <h3>English</h3>
              <p></p>
            </div>
            <span class="arrow">›</span>
          </article>

          <article class="study-card">
            <div class="study-icon"></div>
            <div class="study-copy">
              <h3>Filipino</h3>
              <p></p>
            </div>
            <span class="arrow">›</span>
          </article>
        </div>
      </section>

      <section class="section-block">
        <h2>Done Studies!</h2>
        <div class="done-grid">
          <article class="done-card">
            <div class="done-badge"></div>
            <div>
              <h3>Mathematics</h3>
              <p></p>
            </div>
            <span class="arrow">›</span>
          </article>

          <article class="done-card">
            <div class="done-badge"></div>
            <div>
              <h3>Science</h3>
              <p></p>
            </div>
            <span class="arrow">›</span>
          </article>

          <article class="done-card">
            <div class="done-badge"></div>
            <div>
              <h3>Social Studies</h3>
              <p></p>
            </div>
            <span class="arrow">›</span>
          </article>
        </div>
      </section>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="home_main.html" class="nav-item">
        <img src="home.png" alt="Home" />
      </a>
      <a href="quizhistory2.html" class="nav-item active">
        <img src="tasks.png" alt="Quiz History" />
      </a>
      <a href="#" class="nav-item middle-item">
        <img src="game.png" alt="Game" />
      </a>
      <a href="#" class="nav-item">
        <img src="files.png" alt="Resources" />
      </a>
      <a href="#" class="nav-item">
        <img src="profile.png" alt="Profile" />
      </a>
    </nav>
  </main>
</body>
</html>
