<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeafLET Register UI</title>

  <!-- POPPINS FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#1d1d1d;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* PHONE CONTAINER */
    .phone{
      width:320px;
      height:640px;
      background:#f5f5ee;
      border-radius:12px;
      overflow:hidden;
      position:relative;
      box-shadow:0 0 20px rgba(0,0,0,0.25);
    }

    /* MAIN CONTENT */
    .content{
      padding:24px 18px 85px;
      text-align:center;
    }

    /* LOGO */
    .logo{
      width:95px;
      display:block;
      margin:20px auto 18px;
    }

    /* TITLE */
    h2{
      font-size:18px;
      color:#4B7A1F;
      font-weight:600;
      margin-bottom:10px;
    }

    /* DESCRIPTION */
    .description{
      font-size:12px;
      color:#1E3D07;
      line-height:1.5;
      margin-bottom:20px;
      padding:0 8px;
    }

    /* INPUT GROUP */
    .input-group{
      position:relative;
      margin-bottom:12px;
    }

    /* INPUT BOX */
    .input-box{
      width:100%;
      height:36px;
      border:1px solid #cfd3c2;
      border-radius:7px;
      padding:0 12px;
      font-size:12px;
      outline:none;
      background:#fff;
    }

    .input-box:focus{
      border-color:#4B7A1F;
    }

    /* PASSWORD ICON */
    .eye-icon{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      font-size:12px;
      color:#777;
      cursor:pointer;
    }

    /* BUTTON */
    .btn{
      width:100%;
      height:38px;
      border:none;
      border-radius:7px;
      background:#4B7A1F;
      color:#fff;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:2px;
    }

    .btn:hover{
      background:#3d6618;
    }

    /* BOTTOM TEXT */
    .bottom-text{
      margin-top:12px;
      font-size:12px;
      color:#555;
      text-align:left;
    }

    .bottom-text a{
      color:#4B7A1F;
      text-decoration:none;
      font-weight:600;
    }

    /* NAVIGATION */
    .nav{
      position:absolute;
      bottom:0;
      left:0;
      width:100%;
      height:60px;
      background:#1E3D07;
      display:flex;
      justify-content:space-around;
      align-items:center;
      padding:0 10px;
    }

   /* NAV ICONS */
    .nav img{
      width:20px;
      height:20px;
      object-fit:contain;
      cursor:pointer;
      transition:0.3s;
    }

    .nav img:hover{
      transform:scale(1.08);
    }


    .task-icon{
    width: 33px !important;
    height:33px !important;
}

.game-icon{
  width:70px !important;
  height:70px !important;
  margin-top:-24px;
}

    .profile-icon,
    .files-icon{
      width:24px !important;
      height:20px !important;
    }
  </style>
</head>

<body>

  <!-- MOBILE SCREEN -->
  <div class="phone">

    <div class="content">
      <img src="logo.png" class="logo" alt="LeafLET Logo">
      <h2>Welcome to LeafLET!</h2>
      <p class="description">
        Join LeafLET and start your LET review today
      </p>

      <div class="input-group">
        <input
          type="text"
          class="input-box"
          placeholder="Enter Full Name">
      </div>

      <div class="input-group">
        <input
          type="email"
          class="input-box"
          placeholder="Enter Email Address">
      </div>

      <div class="input-group">
        <input
          type="password"
          class="input-box"
          placeholder="Create Password">

        <span class="eye-icon">👁</span>
      </div>

      <div class="input-group">
        <input
          type="password"
          class="input-box"
          placeholder="Confirm Password">

        <span class="eye-icon">👁</span>
      </div>

      <button class="btn">Register</button>


      <div class="bottom-text">
        Already have an account?
        <a href="#">Log in</a>
      </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="nav">

      <img src="home.png" alt="Home Icon">

      <img
        src="tasks.png"
        class="task-icon"
        alt="Tasks Icon">

      <img
        src="game.png"
        class="game-icon"
        alt="Game Icon">

      <img
        src="files.png"
        class="files-icon"
        alt="Files Icon">

      <img
        src="profile.png"
        class="profile-icon"
        alt="Profile Icon">

    </div>

  </div>

</body>
</html>
