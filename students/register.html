<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeafLET Register UI</title>

  <!-- POPPINS FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/students/register.css" />



</head>

<body>

  <!-- MOBILE SCREEN -->
  <div class="phone">

    <div class="content">
      <img src="logo.png" class="logo" alt="LeafLET Logo">
      <h2>Welcome to LeafLET!</h2>
      <p class="description">
        Join LeafLET and start your LET review today
      </p>

      <div class="input-group">
        <input
          type="text"
          class="input-box"
          placeholder="Enter Full Name">
      </div>

      <div class="input-group">
        <input
          type="email"
          class="input-box"
          placeholder="Enter Email Address">
      </div>

      <div class="input-group">
        <input
          type="password"
          class="input-box"
          placeholder="Create Password">

        <span class="eye-icon">👁</span>
      </div>

      <div class="input-group">
        <input
          type="password"
          class="input-box"
          placeholder="Confirm Password">

        <span class="eye-icon">👁</span>
      </div>

      <button class="btn">Register</button>


      <div class="bottom-text">
        Already have an account?
        <a href="#">Log in</a>
      </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="nav">

      <img src="home.png" alt="Home Icon">

      <img
        src="tasks.png"
        class="task-icon"
        alt="Tasks Icon">

      <img
        src="game.png"
        class="game-icon"
        alt="Game Icon">

      <img
        src="files.png"
        class="files-icon"
        alt="Files Icon">

      <img
        src="profile.png"
        class="profile-icon"
        alt="Profile Icon">

    </div>

  </div>

</body>
</html>
