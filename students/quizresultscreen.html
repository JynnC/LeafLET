<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LeafLET — Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f9f9f2;
      --ink: #1a1a1a;
      --green: #3b631d;
      --green-soft: #2d5018;
      --muted: #3d5a2e;
      --card: #ffffff;
      --border: #e3e6dc;
      --shadow: 0 4px 14px rgba(30, 61, 7, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      overflow-x: hidden;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      padding-top: calc(10px + env(safe-area-inset-top));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: clamp(40px, 11vw, 48px);
      height: auto;
      flex-shrink: 0;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      min-width: 0;
    }

    .brand-text strong {
      font-size: clamp(15px, 4vw, 17px);
      font-weight: 800;
      color: var(--green);
      letter-spacing: 0.02em;
    }

    .brand-text span {
      font-size: clamp(11px, 2.8vw, 12px);
      font-weight: 500;
      color: var(--muted);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: clamp(8px, 2.5vw, 12px);
      flex-shrink: 0;
    }

    .streak {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      font-size: clamp(14px, 3.8vw, 16px);
      color: var(--green);
    }

    .streak .flame {
      font-size: clamp(16px, 4.2vw, 18px);
      line-height: 1;
    }

    .avatar-wrap {
      position: relative;
      width: clamp(36px, 10vw, 42px);
      height: clamp(36px, 10vw, 42px);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      background: #e8eadf;
    }

    .avatar-badge {
      position: absolute;
      top: -1px;
      right: -1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e53935;
      border: 2px solid var(--bg);
    }

    .header-main {
      margin-top: 14px;
      width: 100%;
      max-width: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: 12px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 0;
      background: var(--green);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 99, 29, 0.35);
      touch-action: manipulation;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
    }

    .quiz-title-block {
      min-width: 0;
      max-width: 100%;
      text-align: center;
      padding-right: clamp(0px, 4vw, 52px);
    }

    .quiz-title-block h1 {
      margin: 0;
      font-size: clamp(17px, 4.5vw, 20px);
      font-weight: 800;
      color: var(--green);
      letter-spacing: 0.02em;
      overflow-wrap: anywhere;
    }

    .quiz-title-block p {
      margin: 6px 0 0;
      font-size: clamp(11px, 2.9vw, 13px);
      font-weight: 500;
      color: var(--muted);
      line-height: 1.35;
      max-width: min(280px, 100%);
      margin-inline: auto;
      overflow-wrap: anywhere;
    }

    .timer-row {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--green);
      color: #fff;
      font-weight: 600;
      font-size: clamp(14px, 3.6vw, 16px);
      padding: 8px 18px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    .timer-pill svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .progress-wrap {
      margin-top: 14px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-track {
      flex: 1;
      min-width: 0;
      height: 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .progress-fill {
      height: 100%;
      width: 28%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4d8528, var(--green));
    }

    .progress-label {
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 700;
      color: var(--green);
      min-width: 3ch;
      text-align: right;
    }

    .quiz-scroll {
      flex: 1;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: hidden;
      overflow-y: auto;
      margin-top: 18px;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .q-block {
      margin-bottom: 22px;
    }

    .q-meta {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
      font-size: clamp(12px, 3.2vw, 13px);
      font-weight: 700;
      color: var(--green);
    }

    .q-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(227, 230, 220, 0.9);
    }

    .q-card .label {
      font-size: clamp(12px, 3.1vw, 13px);
      font-weight: 700;
      color: var(--green-soft);
      margin-bottom: 8px;
    }

    .q-card .text {
      margin: 0;
      font-size: clamp(13px, 3.4vw, 15px);
      line-height: 1.45;
      font-weight: 500;
      color: #222;
      overflow-wrap: anywhere;
    }

    .options {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      text-align: left;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 500;
      color: #222;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(30, 61, 7, 0.05);
      touch-action: manipulation;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      overflow-wrap: anywhere;
    }

    .option.selected {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 99, 29, 0.25);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      margin-bottom: 4px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .btn-outline {
      flex: 1;
      min-width: 0;
      height: 44px;
      border-radius: 12px;
      border: 2px solid var(--green);
      background: #fff;
      color: var(--green);
      font-weight: 700;
      font-size: clamp(12px, 3.2vw, 14px);
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-primary {
      flex: 1;
      min-width: 0;
      height: 44px;
      border-radius: 12px;
      border: 0;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: clamp(12px, 3.2vw, 14px);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 99, 29, 0.3);
      touch-action: manipulation;
    }

    /* Bottom bar: one green strip; game sits on a circle drawn inside the bar */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      z-index: 20;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 0;
      padding-top: 8px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
      background: var(--green);
      pointer-events: none;
      overflow: hidden;
      border-radius: 14px 14px 0 0;
    }

    .bottom-nav a,
    .bottom-nav button {
      pointer-events: auto;
      background: transparent;
      border: 0;
      padding: 6px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    /* Icons are drawn for a dark bar (light marks on green) */
    .bottom-nav .nav-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      filter: none;
    }

    .bottom-nav .nav-icon--tasks {
      width: 26px;
      height: 26px;
    }

    .nav-game-slot {
      position: relative;
      flex: 0 0 clamp(50px, 14vw, 58px);
      width: clamp(50px, 14vw, 58px);
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .nav-game-slot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: clamp(46px, 12.5vw, 54px);
      height: clamp(46px, 12.5vw, 54px);
      border-radius: 50%;
      background: radial-gradient(
        circle at 32% 28%,
        rgba(255, 255, 255, 0.12) 0%,
        transparent 42%
      ),
        var(--green);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 0 rgba(0, 0, 0, 0.12);
      z-index: 0;
    }

    .bottom-nav .nav-game-btn {
      position: relative;
      z-index: 1;
      pointer-events: auto;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .bottom-nav .nav-icon--game {
      width: clamp(34px, 9.5vw, 40px);
      height: clamp(34px, 9.5vw, 40px);
      margin-bottom: 0;
      filter: none;
      position: relative;
      z-index: 1;
      object-fit: contain;
    }

    .bottom-nav .nav-icon--files,
    .bottom-nav .nav-icon--profile {
      width: 24px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <img src="./LOGO.png" alt="" width="48" height="48" />
        <div class="brand-text">
          <strong>LeafLET</strong>
          <span>LET Reviewer</span>
        </div>
      </div>
      <div class="top-right">
        <div class="streak" aria-label="Streak 7 days">
          <span>7</span>
          <span class="flame" aria-hidden="true">🔥</span>
        </div>
        <div class="avatar-wrap">
          <img class="avatar" src="./profile.png" alt="Profile" />
          <span class="avatar-badge" aria-label="Notification"></span>
        </div>
      </div>
    </header>

    <div class="header-main">
      <button type="button" class="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18 9 12l6-6" />
        </svg>
      </button>
      <div class="quiz-title-block">
        <h1>General Education</h1>
        <p>Questions is randomized on all subjects</p>
      </div>
    </div>

    <div class="timer-row">
      <div class="timer-pill" aria-label="Time remaining">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
        <span>02:34</span>
      </div>
    </div>

    <div class="progress-wrap" aria-label="Quiz progress 28 percent">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <span class="progress-label">28%</span>
    </div>

    <main class="quiz-scroll">
      <section class="q-block" aria-labelledby="q10-label">
        <div class="q-meta">10/50</div>
        <div class="q-card">
          <div class="label" id="q10-label">Question no. 10</div>
          <p class="text">Which of the following sentences is correctly structured?</p>
        </div>
        <div class="options" role="group" aria-label="Answers for question 10">
          <button type="button" class="option">A. The students was excited about the field trip.</button>
          <button type="button" class="option">B. Neither the teacher nor the students was ready.</button>
          <button type="button" class="option selected">C. The committee have submitted their report.</button>
          <button type="button" class="option">D. Each of the players are wearing their uniforms.</button>
        </div>
      </section>

      <section class="q-block" aria-labelledby="q11-label">
        <div class="q-meta">11/50</div>
        <div class="q-card">
          <div class="label" id="q11-label">Question no. 11</div>
          <p class="text">Which of the following sentences is correctly structured?</p>
        </div>
        <div class="options" role="group" aria-label="Answers for question 11">
          <button type="button" class="option">A. The students was excited about the field trip.</button>
          <button type="button" class="option">B. Neither the teacher nor the students was ready.</button>
          <button type="button" class="option selected">C. The committee have submitted their report.</button>
          <button type="button" class="option">D. Each of the players are wearing their uniforms.</button>
        </div>
      </section>

      <div class="actions">
        <button type="button" class="btn-outline">Quiz History</button>
        <button type="button" class="btn-primary">Next</button>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button type="button" aria-label="Home">
      <img class="nav-icon" src="./home.png" alt="" />
    </button>
    <button type="button" aria-label="Tasks">
      <img class="nav-icon nav-icon--tasks" src="./tasks.png" alt="" />
    </button>
    <div class="nav-game-slot">
      <button type="button" class="nav-game-btn" aria-label="Play">
        <img class="nav-icon nav-icon--game" src="./game.png" alt="" />
      </button>
    </div>
    <button type="button" aria-label="Files">
      <img class="nav-icon nav-icon--files" src="./files.png" alt="" />
    </button>
    <button type="button" aria-label="Profile">
      <img class="nav-icon nav-icon--profile" src="./profile.png" alt="" />
    </button>
  </nav>

  <script>
    document.querySelectorAll(".options").forEach(function (group) {
      group.querySelectorAll(".option").forEach(function (btn) {
        btn.addEventListener("click", function () {
          group.querySelectorAll(".option").forEach(function (b) {
            b.classList.remove("selected");
          });
          btn.classList.add("selected");
        });
      });
    });
  </script>
</body>
</html>
