<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeafLET Reset Password</title>

  <!-- POPPINS FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/students/resetpass.css" />

</head>
<body>

  <!-- MOBILE SCREEN -->
  <div class="phone">

    <div class="content">
      <img src="logo.png" class="logo" alt="LeafLET Logo">
      <h2>Forgot your password?</h2>
      <p class="description">
        Enter your email address to reset your password.
      </p>

      <input
        type="email"
        class="input-box"
        placeholder="Enter your email address">

      <p class="info-text">
        If your email is registered, you will receive an
        email containing the reset password link.
      </p>

      <button class="btn">Send reset link</button>

      <div class="bottom-text">
        Remember your password?
        <a href="#">Back to login</a>
      </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="nav">

      <img src="home.png" alt="Home Icon">

      <img src="tasks.png"
        class="task-icon"
        alt="Tasks Icon">

      <img src="game.png"
        class="game-icon"
        alt="Game Icon">

      <img src="files.png"
        class="files-icon"
        alt="Files Icon">

      <img src="profile.png"
        class="profile-icon"
        alt="Profile Icon">

    </div>

  </div>

</body>
</html>
