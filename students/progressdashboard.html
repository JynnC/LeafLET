<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz History</title>
  <link rel="stylesheet" href="../assets/css/students/progressdashboard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="phone">
    <section class="content">
      <header class="top-bar">
        <div class="brand">
          <div class="logo-placeholder">
            <img src="../assets/images/LOGO.png" alt="LeafLET logo" />
          </div>
          <div class="brand-text">
            <h1>LeafLET</h1>
            <span>LET Reviewer</span>
          </div>
        </div>

        <div class="top-right">
          <div class="status-badge">
            <span class="status-icon"></span>
            <span class="status-value"></span>
          </div>
          <div class="profile-photo"></div>
        </div>
      </header>

      <section class="title-row">
        <button class="back-button" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="page-heading">
          <h1>Progress Dashboard</h1>
          <p>Summary of your progress</p>
        </div>
      </section>

      <section class="section-block">
        <h2>Choose Category</h2>

        <div class="category-grid">
          <article class="category-card">
            <div class="category-icon">
              <img src="../assets/images/generalED.png" alt="General Education" />
            </div>
            <h3>General Education</h3>
          </article>

          <article class="category-card">
            <div class="category-icon">
              <img src="../assets/images/ProfessionalED.png" alt="Professional Education" />
            </div>
            <h3>Professional Education</h3>
          </article>

          <article class="category-card">
            <div class="category-icon">
              <img src="../assets/images/majors.png" alt="Majors" />
            </div>
            <h3>Majors</h3>
          </article>
        </div>
      </section>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="home_main.html" class="nav-item">
        <img src="home.png" alt="Home" />
      </a>
      <a href="quizhistory.html" class="nav-item active">
        <img src="tasks.png" alt="Quiz History" />
      </a>
      <a href="#" class="nav-item middle-item">
        <img src="game.png" alt="Game" />
      </a>
      <a href="#" class="nav-item">
        <img src="files.png" alt="Resources" />
      </a>
      <a href="#" class="nav-item">
        <img src="profile.png" alt="Profile" />
      </a>
    </nav>
  </main>

</html>
