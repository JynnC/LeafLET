<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/students/student-pages.css" />
</head>
<body class="exam-page">

  <div class="phone">

    <div class="exam-scroll">

      <header class="top-bar">
        <div class="brand">
          <img src="../assets/images/LOGO2.png" alt="LeafLET" class="brand-logo" width="52" height="52" />
          <div class="brand-text">
            <p class="brand-name">LeafLET</p>
            <p class="brand-tagline">Let Reviewer</p>
          </div>
        </div>
        <div class="top-bar-right">
          <div class="streak-wrap">
            <div class="streak-slot" aria-label="Streak (empty)"></div>
            <span class="slot-label">Streak</span>
          </div>
          <div class="avatar-wrap">
            <div class="avatar-slot" aria-label="Profile photo (empty)"></div>
            <span class="slot-label">Profile</span>
          </div>
        </div>
      </header>

      <div class="title-row">
        <button type="button" class="back-btn" aria-label="Back">‹</button>
        <div class="title-block">
          <h2>Exam Simulation</h2>
          <p class="subtitle-slot">
            <span class="placeholder-hint">[Subtitle]</span>
          </p>
        </div>
      </div>

      <div class="timer-pill">
        <span class="timer-icon" aria-hidden="true"></span>
        <span>Time: 00:00:00</span>
      </div>

      <div class="progress-header">
        <span class="q-count">question 0/100</span>
        <span class="pct-slot">
          <span class="placeholder-hint">[%]</span>
        </span>
      </div>
      <div class="progress-bar-wrap" aria-label="Progress (empty)">
        <div class="progress-bar-fill"></div>
      </div>

      <div class="category-chip">
        <span class="placeholder-hint">[Category]</span>
      </div>

      <section class="question-panel" aria-label="Question area">
        <p class="placeholder-hint">[Question text]</p>
      </section>

      <div class="options" role="radiogroup" aria-label="Answer choices">
        <button type="button" class="option-btn">A.</button>
        <button type="button" class="option-btn">B.</button>
        <button type="button" class="option-btn">C.</button>
        <button type="button" class="option-btn">D.</button>
      </div>

      <div class="row-actions">
        <button type="button" class="btn-outline">Previous Question</button>
        <button type="button" class="btn-solid">Next Question</button>
      </div>

      <div class="links-row">
        <button type="button" class="link-flag">Flag this Question</button>
        <button type="button" class="link-exit">Exit Exam</button>
      </div>

    </div>

    <nav class="nav" aria-label="Main navigation">
      <a href="#" aria-label="Home"><img src="home.png" alt="" /></a>
      <a href="#" aria-label="Tasks"><img src="tasks.png" class="task-icon" alt="" /></a>
      <a href="#" aria-label="Game"><img src="game.png" class="game-icon" alt="" /></a>
      <a href="#" aria-label="Files"><img src="files.png" class="files-icon" alt="" /></a>
      <a href="#" aria-label="Profile"><img src="profile.png" class="profile-icon" alt="" /></a>
    </nav>

  </div>

</body>
</html>
